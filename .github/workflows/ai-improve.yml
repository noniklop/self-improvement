name: AI Self-Improvement

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Run AI improvement agent
        env:
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }} 
        run: python improve.py

      - name: Run tests after improvement
        run: |
          pip install pytest
          pytest tests/ -v
