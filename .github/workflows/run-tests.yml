name: Run Tests on Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      server_id: ${{ steps.deploy.outputs.server_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Hetzner VPS
        id: deploy
        run: |
          chmod +x deploy.sh
          ./deploy.sh \
            "${{ secrets.HETZNER_API_TOKEN }}" \
            "${{ secrets.TAILSCALE_AUTH_KEY }}" \
            "${{ secrets.MODELS_TOKEN }}" \
            "${{ github.repository }}"

  run-tests:
    needs: deploy
    runs-on: [self-hosted, hetzner-runner]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  cleanup:
    needs: [deploy, run-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Delete Hetzner VPS
        run: |
          SERVER_ID="${{ needs.deploy.outputs.server_id }}"
          echo "🗑️ Deleting VPS ${SERVER_ID}..."
          curl -s -X DELETE \
            -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
            "https://api.hetzner.cloud/v1/servers/${SERVER_ID}"
          echo "✅ VPS deleted"
